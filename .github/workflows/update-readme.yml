name: AI README Updater

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    # Secrets are not exposed to PRs coming from forks.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get API diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff "$BASE_SHA" "$HEAD_SHA" -- \
            "src/**/*.controller.ts" \
            "src/**/dto/*.ts" \
            "prisma/schema.prisma" \
            > api-diff.txt

      - name: Check for API changes
        id: api_changes
        run: |
          if [ -s api-diff.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update ROUTES.md with AI
        if: steps.api_changes.outputs.changed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/update-routes.mjs

      - name: Commit ROUTES.md changes
        if: steps.api_changes.outputs.changed == 'true'
        run: |
          if git diff --quiet ROUTES.md; then
            echo "ROUTES.md already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ROUTES.md
          git commit -m "docs: update ROUTES.md from API changes"
          git push